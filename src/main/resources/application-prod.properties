# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}

quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.jdbc.max-size=16
quarkus.hibernate-orm.database.default-schema=papertrailbot
quarkus.hibernate-orm.schema-management.strategy=validate

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.create-schemas=true
quarkus.flyway.schemas=papertrailbot
quarkus.flyway.default-schema=papertrailbot

# Global Redis Settings
quarkus.cache.type=redis
quarkus.redis.hosts=${REDIS_URL}
# Redis Settings
quarkus.cache.redis."auditLog".ttl=30D
quarkus.cache.redis."messageLog".ttl=30D
quarkus.redis.max-pool-size=20
quarkus.redis.max-pool-waiting=60

# Port and Host
quarkus.http.port=${PORT:8080}

quarkus.management.enabled=true
quarkus.management.port=${MANAGEMENT_PORT:9000}

# Logging Level
quarkus.log.level=INFO
quarkus.log.category."io.github.eggy03.papertrail.api.service".level=${LOG_LEVEL:INFO}

# Analytics
quarkus.analytics.disabled=true

# Banner
quarkus.banner.path=banner.txt